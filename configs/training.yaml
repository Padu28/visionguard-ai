# ---------------------------------------------------------------
# VisionGuard AI — training configuration
# ---------------------------------------------------------------
random_state: 42

baseline:                     # simple features + logistic regression
  features: [intensity, gradient]
  model: logistic_regression
  params: {C: 1.0, max_iter: 3000, class_weight: balanced}

improved:                     # rich handcrafted features (HOG + LBP + FFT) + RBF-SVM
  features: [intensity, gradient, hog, lbp, fft]
  model: svm_rbf
  params: {C: 8.0, gamma: scale, class_weight: balanced}

robust:                       # improved features + robustness-aware (corruption) augmentation
  features: [intensity, gradient, hog, lbp, fft]
  model: svm_rbf
  params: {C: 8.0, gamma: scale, class_weight: balanced}

cnn:                          # optional — requires PyTorch (pip install -r requirements-cnn.txt)
  architecture: resnet18      # resnet18 | small_cnn
  pretrained: true
  freeze_backbone_epochs: 3
  epochs: 25
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 5
  class_weighted_loss: true

explainability:
  occlusion_patch: 16
  occlusion_stride: 8

storage:
  database: data/processed/visionguard.db
  reports_dir: reports
  checkpoints_dir: checkpoints
